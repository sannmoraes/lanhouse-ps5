<!-- title: Entrar -->
<!-- script: auth.js -->
<div class="max-w-md mx-auto p-4 pt-10">
  <div class="bg-panel border border-line rounded-xl p-6 flex flex-col gap-4">
    <div>
      <h1 class="text-2xl font-bold">Entrar</h1>
      <p class="text-sm text-mute">Use o e-mail e a senha da sua conta.</p>
    </div>
    <form id="login-form" class="flex flex-col gap-3" novalidate>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">E-mail</span><input id="email" type="email" autocomplete="email" required class="field" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Senha</span><input id="password" type="password" autocomplete="current-password" required class="field" /></label>
      <p id="form-msg" class="hidden text-sm"></p>
      <button id="submit" class="py-3 rounded-lg btn-main">Entrar</button>
      <a href="/recuperar-senha.html" class="text-sm text-pink text-center hover:underline">Esqueci minha senha</a>
    </form>
    <p class="text-sm text-mute text-center">Ainda não tem conta? <a href="/criar-conta.html" class="text-pink font-medium hover:underline">Criar conta</a></p>
  </div>
</div>
