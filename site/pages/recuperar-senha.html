<!-- title: Recuperar senha -->
<!-- script: recuperar.js -->
<div class="max-w-md mx-auto p-4 pt-10">
  <div class="bg-panel border border-line rounded-xl p-6 flex flex-col gap-4">
    <div>
      <h1 class="text-2xl font-bold">Recuperar senha</h1>
      <p id="sub" class="text-sm text-mute">Informe o e-mail da sua conta. Enviamos um código de 6 dígitos.</p>
    </div>

    <!-- passo 1 -->
    <form id="form-email" class="flex flex-col gap-3" novalidate>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">E-mail</span><input id="email" type="email" autocomplete="email" required class="field" /></label>
      <p id="msg1" class="hidden text-sm"></p>
      <button id="go1" class="py-3 rounded-lg btn-main">Enviar código</button>
    </form>

    <!-- passo 2 -->
    <form id="form-code" class="hidden flex flex-col gap-3" novalidate>
      <p id="sent-to" class="text-sm text-money"></p>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Código de 6 dígitos</span><input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" class="field font-mono tracking-[0.4em] text-lg text-center" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Nova senha (8 caracteres ou mais)</span><input id="pw" type="password" autocomplete="new-password" class="field" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Repita a nova senha</span><input id="pw2" type="password" autocomplete="new-password" class="field" /></label>
      <p id="msg2" class="hidden text-sm"></p>
      <button id="go2" class="py-3 rounded-lg btn-main">Trocar senha</button>
      <div class="flex justify-between text-sm"><button type="button" id="resend" class="text-pink hover:underline">Enviar outro código</button><button type="button" id="back" class="text-mute hover:text-ink">Mudar e-mail</button></div>
    </form>

    <p id="done" class="hidden text-money text-sm"></p>
    <p class="text-sm text-mute text-center"><a href="/entrar.html" class="text-pink font-medium hover:underline">Voltar para entrar</a></p>
  </div>
</div>
