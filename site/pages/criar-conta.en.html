<!-- title: Create account -->
<!-- script: auth.js -->
<div class="max-w-md mx-auto p-4 pt-10">
  <div class="bg-panel border border-line rounded-xl p-6 flex flex-col gap-4">
    <div>
      <h1 class="text-2xl font-bold">Create account</h1>
      <p class="text-sm text-mute">With an account you buy time, join the queue and keep your controls.</p>
    </div>
    <form id="register-form" class="flex flex-col gap-3" novalidate>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Email</span><input id="email" type="email" autocomplete="email" required class="field" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Repeat the email</span><input id="email2" type="email" autocomplete="off" required class="field" /><span class="text-xs text-mute">We send a code to confirm this email. Check it carefully.</span></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Nickname (shown to everyone in the queue)</span><input id="nickname" maxlength="16" autocomplete="nickname" required class="field" /><span class="text-xs text-mute">2 to 16 characters: letters, numbers, space, _ - .</span></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Password (8 characters or more)</span><input id="password" type="password" autocomplete="new-password" required class="field" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Repeat the password</span><input id="password2" type="password" autocomplete="new-password" required class="field" /></label>
      <label class="flex items-start gap-2 text-sm"><input id="adult" type="checkbox" class="mt-1 accent-pink" /><span>I am 18 or older and I accept the <a href="/en/termos.html" target="_blank" rel="noopener" class="text-pink hover:underline">Terms of use</a> and the <a href="/en/privacidade.html" target="_blank" rel="noopener" class="text-pink hover:underline">Privacy policy</a>: time only runs while the console is online and time already used is not refunded once the turn has started.</span></label>
      <p id="form-msg" class="hidden text-sm"></p>
      <button id="submit" class="py-3 rounded-lg btn-main">Create account</button>
    </form>
    <p class="text-sm text-mute text-center">Already have an account? <a href="/en/entrar.html" class="text-pink font-medium hover:underline">Sign in</a></p>
  </div>
</div>
