<!-- title: Criar conta -->
<!-- script: auth.js -->
<div class="max-w-md mx-auto p-4 pt-10">
  <div class="bg-panel border border-line rounded-xl p-6 flex flex-col gap-4">
    <div>
      <h1 class="text-2xl font-bold">Criar conta</h1>
      <p class="text-sm text-mute">Com a conta você compra tempo, entra na fila e guarda seus controles.</p>
    </div>
    <form id="register-form" class="flex flex-col gap-3" novalidate>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">E-mail</span><input id="email" type="email" autocomplete="email" required class="field" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Repita o e-mail</span><input id="email2" type="email" autocomplete="off" required class="field" /><span class="text-xs text-mute">Enviamos um código para confirmar este e-mail. Confira com atenção.</span></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Apelido (aparece para todos na fila)</span><input id="nickname" maxlength="16" autocomplete="nickname" required class="field" /><span class="text-xs text-mute">2 a 16 caracteres: letras, números, espaço, _ - .</span></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Senha (8 caracteres ou mais)</span><input id="password" type="password" autocomplete="new-password" required class="field" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Repita a senha</span><input id="password2" type="password" autocomplete="new-password" required class="field" /></label>
      <label class="flex items-start gap-2 text-sm"><input id="adult" type="checkbox" class="mt-1 accent-pink" /><span>Tenho 18 anos ou mais e aceito os <a href="/termos.html" target="_blank" rel="noopener" class="text-pink hover:underline">Termos de uso</a> e a <a href="/privacidade.html" target="_blank" rel="noopener" class="text-pink hover:underline">Política de privacidade</a>: o tempo só corre com o console online e não há devolução do tempo já usado depois que o turno começa.</span></label>
      <p id="form-msg" class="hidden text-sm"></p>
      <button id="submit" class="py-3 rounded-lg btn-main">Criar conta</button>
    </form>
    <p class="text-sm text-mute text-center">Já tem conta? <a href="/entrar.html" class="text-pink font-medium hover:underline">Entrar</a></p>
  </div>
</div>
