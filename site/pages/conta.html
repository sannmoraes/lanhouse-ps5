<!-- title: Minha conta -->
<!-- script: conta.js -->
<div class="max-w-2xl mx-auto p-4 flex flex-col gap-4">
  <h1 class="text-2xl font-bold pt-2">Minha conta</h1>

  <section class="bg-panel border border-line rounded-xl p-5 flex flex-col gap-3">
    <h2 class="font-bold">Perfil</h2>
    <div class="text-sm"><span class="text-mute">E-mail:</span> <span id="p-email">—</span></div>
    <form id="nick-form" class="flex flex-col sm:flex-row gap-2 sm:items-end">
      <label class="flex-1 flex flex-col gap-1 text-sm"><span class="text-mute">Apelido</span><input id="p-nick" maxlength="16" class="field" /></label>
      <button class="py-2.5 px-4 rounded-lg btn-main">Salvar apelido</button>
    </form>
    <p id="nick-msg" class="hidden text-sm"></p>
  </section>

  <section class="bg-panel border border-line rounded-xl p-5 flex flex-col gap-3">
    <h2 class="font-bold">Trocar senha</h2>
    <form id="pw-form" class="flex flex-col gap-3">
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Senha atual</span><input id="pw-cur" type="password" autocomplete="current-password" class="field" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Nova senha (8 caracteres ou mais)</span><input id="pw-new" type="password" autocomplete="new-password" class="field" /></label>
      <label class="flex flex-col gap-1 text-sm"><span class="text-mute">Repita a nova senha</span><input id="pw-new2" type="password" autocomplete="new-password" class="field" /></label>
      <button class="py-2.5 rounded-lg btn-main self-start px-4">Trocar senha</button>
    </form>
    <p id="pw-msg" class="hidden text-sm"></p>
    <p class="text-xs text-mute">Ao trocar a senha, você sai dos outros aparelhos.</p>
  </section>

  <section class="bg-panel border border-line rounded-xl p-5 flex flex-col gap-3">
    <div class="flex items-center justify-between"><h2 class="font-bold">Minhas compras</h2><a href="/controles.html" class="text-sm text-pink hover:underline">Configurar controles</a></div>
    <div id="orders" class="text-sm divide-y divide-line"></div>
  </section>

  <section class="bg-panel border border-bad/40 rounded-xl p-5 flex flex-col gap-3">
    <h2 class="font-bold text-bad">Apagar conta</h2>
    <p class="text-sm text-mute">Apaga seu acesso e seus controles salvos. Não dá para desfazer. Você só pode apagar se não tiver ficha na fila.</p>
    <form id="del-form" class="flex flex-col sm:flex-row gap-2 sm:items-end">
      <label class="flex-1 flex flex-col gap-1 text-sm"><span class="text-mute">Confirme com a sua senha</span><input id="del-pw" type="password" autocomplete="current-password" class="field" /></label>
      <button class="py-2.5 px-4 rounded-lg border border-bad text-bad hover:bg-bad hover:text-white font-medium">Apagar minha conta</button>
    </form>
    <p id="del-msg" class="hidden text-sm"></p>
  </section>

  <button id="logout" class="self-start px-4 py-2 rounded-lg bg-panel2 hover:bg-line text-sm">Sair da conta</button>
</div>
